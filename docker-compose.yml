version: '3.8'

services:
  # 1. MySQL Database Container
  mysqldb:
    image: mysql:8.0
    container_name: motolink-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Ashwin@2011
      MYSQL_DATABASE: motolink_db
    ports:
      - "3306:3306"
    restart: always

  # 2. Spring Boot Backend Container
  backend:
    build: ./backend-spring-boot-mysql
    container_name: motolink-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/motolink_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Ashwin@2011
    depends_on:
      - mysqldb
    restart: always
